<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none" width="100%" height="100%">
  <!-- Background with dark midnight blueprint gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="50%" stop-color="#162C46"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39B5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Architectural Blueprint Grid -->
  <g stroke="#39B5FF" stroke-width="1" stroke-opacity="0.12">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>

    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Stylized Geometric Construction Silhouette -->
  <path d="M220 580V320L640 160L1060 320V580H220Z" fill="#1E3E62" fill-opacity="0.5"/>
  <path d="M340 580V380L640 260L940 380V580H340Z" fill="#0B192C" fill-opacity="0.8"/>

  <!-- Angular cyan girder line (from official logo) -->
  <path d="M180 200H980L1120 420" stroke="#39B5FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Play Button Emblem -->
  <circle cx="640" cy="380" r="54" fill="#0B192C" stroke="#39B5FF" stroke-width="3"/>
  <circle cx="640" cy="380" r="44" fill="url(#cyanGrad)"/>
  <polygon points="630,360 660,380 630,400" fill="#0B192C"/>

  <!-- Titles -->
  <text x="640" y="480" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle">استعراض أعمال ومشاريع مؤسسة رؤيانا الحديثة للمقاولات</text>
  <text x="640" y="520" fill="#39B5FF" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">مساحة مخصصة للفيديو التعريفي | public/videos/hero-showcase.mp4</text>
</svg>
